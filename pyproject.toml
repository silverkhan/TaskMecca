[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-mecca"
version = "0.2.0"
description = "Local-first orchestration and observability for multi-agent coding workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Task Mecca contributors"}]
keywords = ["agents", "multi-agent", "codex", "orchestration", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
task-mecca = "task_mecca.cli:main"

[project.urls]
Homepage = "https://github.com/silverkhan/TaskMecca"
Repository = "https://github.com/silverkhan/TaskMecca"
Issues = "https://github.com/silverkhan/TaskMecca/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
