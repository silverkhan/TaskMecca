name: Publish stable release

on:
  push:
    branches: [main]
    paths:
      - "cmd/task-mecca/**"
      - "internal/**"
      - "goassets/**"
      - "go.mod"
      - "install.sh"
      - "install.ps1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task-mecca-release-stable
  cancel-in-progress: true

jobs:
  platform-gate:
    name: Pre-release native update and rollback gate · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Verify native upgrade, rollback and data-safety paths
        run: go test ./internal/maintenance ./internal/webui ./internal/install -run "Upgrade|Rollback|Migration|Installed|BrandAssets" -count=1

  release:
    needs: platform-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate release version bump
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(tr -d '\r\n' < goassets/template/_task_mecca/VERSION)"
          cli_version="$(sed -n 's/^var version = "\([^"]*\)"/\1/p' cmd/task-mecca/main.go)"
          test "$current_version" = "$cli_version"
          note_path="goassets/template/_task_mecca/framework/release-notes/current.json"
          remote_note_path="release-notes/${current_version}.json"
          test -f "$note_path"
          test -f "$remote_note_path"
          note_version="$(jq -r '.version // empty' "$note_path")"
          test "$note_version" = "$current_version"
          index_version="$(jq -r '.releases[0].version // empty' release-notes/index.json)"
          test "$index_version" = "$current_version"
          diff -u <(jq -S . "$note_path") <(jq -S . "$remote_note_path")
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            previous_version="$(git show HEAD^:goassets/template/_task_mecca/VERSION 2>/dev/null | tr -d '\r\n' || true)"
            if [ -n "$previous_version" ] && [ "$previous_version" = "$current_version" ]; then
              echo "::error::Release-triggering change requires a version bump (still $current_version)."
              exit 1
            fi
          fi
      - name: Check Web UI JavaScript
        run: |
          node --check goassets/template/_task_mecca/framework/web/app.js
          grep -q "function hubView()" goassets/template/_task_mecca/framework/web/app.js
          grep -q "function bindHubActions()" goassets/template/_task_mecca/framework/web/app.js
          grep -q "function switchProject(path)" goassets/template/_task_mecca/framework/web/app.js
          grep -Fq "function processTaskNotifications(snapshot,context={})" goassets/template/_task_mecca/framework/web/app.js
          grep -q "function renderNotificationPanel()" goassets/template/_task_mecca/framework/web/app.js
          grep -q "function notificationCapability()" goassets/template/_task_mecca/framework/web/app.js
          test -f goassets/template/_task_mecca/framework/web/sw.js
          grep -q "function migrationResyncPrompt(result)" goassets/template/_task_mecca/framework/web/app.js
          grep -q "function showMigrationResyncModal(result)" goassets/template/_task_mecca/framework/web/app.js
      - name: Test Go runtime and vet
        run: |
          go test ./...
          go vet ./...
      - name: Test Web update, UI, notification and release-note behavior
        run: |
          node --test tests/web_release_notes_030.test.cjs tests/web_select_ui.test.cjs tests/web_storage_management.test.cjs tests/web_notification_delivery.test.cjs tests/web_update_flow.test.cjs
      - name: Build standalone binaries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/task-mecca-windows-amd64.exe ./cmd/task-mecca
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/task-mecca-macos-amd64 ./cmd/task-mecca
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/task-mecca-macos-arm64 ./cmd/task-mecca
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/task-mecca-linux-amd64 ./cmd/task-mecca
          cp goassets/template/_task_mecca/VERSION dist/VERSION.txt
          ! grep -Fq '\\n' dist/VERSION.txt
          ! grep -Fq '\\r' dist/VERSION.txt
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' dist/VERSION.txt
          (cd dist && sha256sum task-mecca-* > SHA256SUMS.txt)
      - name: Update Stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail

          publish_release() {
            tag="$1"
            title="$2"
            notes="$3"

            git tag -f "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag" --force

            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" \
                --target "$GITHUB_SHA" \
                --title "$title" \
                --notes "$notes" \
                --prerelease
            fi

            # Keep the old VERSION.txt available until every executable and checksum is ready.
            gh release upload "$tag" \
              dist/task-mecca-windows-amd64.exe \
              dist/task-mecca-macos-amd64 \
              dist/task-mecca-macos-arm64 \
              dist/task-mecca-linux-amd64 \
              dist/SHA256SUMS.txt \
              --clobber

            # Publish the new version marker last so clients never discover a half-published build.
            gh release upload "$tag" dist/VERSION.txt --clobber
            gh release edit "$tag" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          }

          publish_release release-stable \
            "Task Mecca Stable" \
            "Stable standalone build from main. Commit: $GITHUB_SHA"

      - name: Smoke test one-line installer
        shell: bash
        run: |
          set -euxo pipefail
          export HOME="$RUNNER_TEMP/task-mecca-installer-home"
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          expected_version="$(tr -d '\r\n' < goassets/template/_task_mecca/VERSION)"
          TASK_MECCA_RELEASE_TAG=release-stable sh ./install.sh
          version_output="$(task-mecca --version)"
          printf '%s\n' "$version_output" | sed -n '1p' | grep -Fx "task-mecca $expected_version"

          project="$RUNNER_TEMP/task-mecca-web-smoke"
          mkdir -p "$project"
          cd "$project"
          task-mecca init
          task-mecca web --host 127.0.0.1 --no-open
          before_pid="$(task-mecca web status | awk '/^PID/{print $2}')"
          test -n "$before_pid"
          curl -fsS http://127.0.0.1:18765/api/health
          task-mecca web --host 127.0.0.1 --no-open
          after_pid="$(task-mecca web status | awk '/^PID/{print $2}')"
          test "$before_pid" = "$after_pid"
          task-mecca web stop
          ! curl -fsS --max-time 1 http://127.0.0.1:18765/api/health

  windows-installer-smoke:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Test PowerShell one-line installer
        shell: powershell
        env:
          TASK_MECCA_RELEASE_TAG: release-stable
        run: |
          irm https://raw.githubusercontent.com/silverkhan/TaskMecca/main/install.ps1 | iex
          $expected = (irm https://github.com/silverkhan/TaskMecca/releases/download/release-stable/VERSION.txt).Trim()
          $output = @(task-mecca --version)
          if ($output.Count -lt 2) { throw "Unexpected version output: $($output -join ' | ')" }
          if ($output[0] -ne "task-mecca $expected") { throw "Installed version mismatch: $($output[0]) != task-mecca $expected" }
          if ($output -notcontains "channel stable") { throw "Expected Stable channel, got: $($output -join ' | ')" }
