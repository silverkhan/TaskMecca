name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-mecca-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-management:
    name: File-preserving project management · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Archive and monitoring preserve files (no native Trash access)
        run: go test ./internal/maintenance ./internal/projectguard -run "Archive|ProjectManagement|ProjectMonitoring|Suppression|ExplicitRegistration" -count=1 -v

  go-runtime:
    name: Go runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test Go runtime with Activity CI evidence
        run: node scripts/record-ci-test.cjs --output activity-ci-evidence.json -- go test ./...
      - name: Preserve full regression CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: activity-ci-evidence.json
          if-no-files-found: warn
      - name: Test CI evidence schema
        run: node --test tests/record_ci_test.test.cjs
      - name: Lifecycle read correctness and scale regression gate
        env:
          TASK_MECCA_LIFECYCLE_PERF: "1"
          TASK_MECCA_LIFECYCLE_PERF_REPORT: lifecycle-performance.json
        run: |
          go test ./internal/backlog -run '^TestLifecycleProjectionPerformanceRegression$' -count=1 -v
          go test -race ./internal/backlog ./internal/webui -run 'TestLifecycleProjection' -count=1
          node --test tests/web_detail_lifecycle_live.test.cjs tests/web_task_detail_prefetch.test.cjs
      - name: Preserve lifecycle performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-performance-${{ github.run_id }}
          path: lifecycle-performance.json
          if-no-files-found: ignore

      - name: Vet Go runtime
        run: go vet ./...
      - name: Build Go CLI
        run: go build ./cmd/task-mecca
      - name: Check Web JavaScript syntax
        run: |
          node --check goassets/template/_task_mecca/framework/web/app.js
          node --check goassets/template/_task_mecca/framework/web/select-ui.js
          node --check goassets/template/_task_mecca/framework/web/sw.js
          node --check goassets/template/_task_mecca/framework/web/terminal.js
      - name: Test Controller review and current user attention
        run: node --test tests/web_completion_review.test.cjs tests/web_user_attention.test.cjs tests/web_common_attention.test.cjs tests/web_live_list.test.cjs tests/web_task_detail_prefetch.test.cjs tests/web_notification_center.test.cjs tests/web_notification_delivery.test.cjs tests/web_notification_pagination.test.cjs tests/web_push_service_worker.test.cjs tests/web_notification_settings.test.cjs tests/web_telegram_controls_ui.test.cjs tests/web_storage_management.test.cjs tests/web_terminal_service_restart.test.cjs tests/web_terminal_theme.test.cjs tests/web_glass_theme.test.cjs tests/web_select_ui.test.cjs tests/web_preview_builds.test.cjs
      - name: Verify Activity detail timeline and ledger controls
        run: node --test tests/web_activity_detail.test.cjs
      - name: Verify structured and legacy release note formats
        run: node --test tests/web_release_note_formats.test.cjs
      - name: Verify Stable promotion gates and retained Windows hotfix
        run: node --test tests/stable_release_guards.test.cjs
      - name: Mirror Stable prepublish Web regression gate
        run: node --test tests/stable_release_guards.test.cjs tests/web_release_note_formats.test.cjs tests/web_task_detail_prefetch.test.cjs tests/web_notification_center.test.cjs tests/web_notification_delivery.test.cjs tests/web_telegram_controls_ui.test.cjs tests/web_select_ui.test.cjs tests/web_storage_management.test.cjs tests/web_update_flow.test.cjs tests/web_terminal_service_restart.test.cjs
      - name: Verify backlog auto pagination and stable layout
        run: node --test tests/backlog_list_controls.test.cjs
      - name: Verify Python-free Web guidance
        run: node --test tests/web_go_only_runtime.test.cjs
      - name: Test Web project session persistence
        run: node --test tests/web_project_sessions.test.cjs

  glass-browser:
    name: Glass fixture browser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/glass-runtime" --no-save --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/glass-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check Glass state and real app rendering with synthetic APIs
        env:
          GLASS_EVIDENCE_DIR: glass-browser-evidence
        run: |
          export GLASS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/glass-runtime/node_modules/playwright"
          node --test tests/web_glass_theme.test.cjs tests/web_glass_browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            glass-browser-evidence/browser-contract.json
            glass-browser-evidence/photo-delivery.json
            glass-browser-evidence/desktop-light-backlog.png
            glass-browser-evidence/desktop-dark-backlog.png
            glass-browser-evidence/mobile-dark-backlog.png
            glass-browser-evidence/mobile-height-orientation.png
            glass-browser-evidence/mobile-navigation-dialog.png
            glass-browser-evidence/desktop-unsupported-blur-emulated.png
            glass-browser-evidence/desktop-reduced-preferences.png
          if-no-files-found: error
          retention-days: 7

  platform-builds:
    name: Platform build · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Native macOS runners are newer than the minimum Go toolchain in go.mod.
          # Use a current compiler here while retaining go.mod compatibility.
          go-version: "1.24.x"
      - name: Test upgrade and rollback paths
        run: go test ./internal/maintenance ./internal/webui -run "Upgrade|Rollback|PowerShellQuote|BrandAssets"
      - name: Build Go CLI
        run: go build ./cmd/task-mecca

  standalone-smoke:
    name: Standalone CLI · Python-free project installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify standalone installer output without Python
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/task-mecca" ./cmd/task-mecca
          "$RUNNER_TEMP/task-mecca" --version
          project="$(mktemp -d)"
          mkdir -p "$RUNNER_TEMP/task-mecca-smoke-home"
          (
            export HOME="$RUNNER_TEMP/task-mecca-smoke-home"
            cd "$project"
            "$RUNNER_TEMP/task-mecca" init
            test -f "_task_mecca/manifest.json"
            test -z "$(find _task_mecca -name '*.py' -print -quit)"
            echo "Python-free standalone project initialization verified"
          )
