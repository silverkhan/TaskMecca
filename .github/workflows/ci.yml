name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Python module CLI smoke
        run: python -m task_mecca --version

  go-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build ./cmd/task-mecca
      - name: Go CLI backlog smoke
        run: |
          tmp="$(mktemp -d)"
          go run ./cmd/task-mecca init --project "$tmp"
          go run ./cmd/task-mecca ensure-backlog --project "$tmp" --json
          go run ./cmd/task-mecca next-id A --project "$tmp" --json
