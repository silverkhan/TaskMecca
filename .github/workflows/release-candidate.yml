name: Publish 0.3.0 release candidate

on:
  push:
    branches: ["release/0.3.0-rc.1"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task-mecca-0.3.0-rc.1
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify and package candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate release candidate contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat goassets/template/_task_mecca/VERSION)" = "0.3.0-rc.1"
          grep -Fqx 'var version = "0.3.0-rc.1"' cmd/task-mecca/main.go
          test "$(jq -r '.releases[0].version' release-notes/index.json)" = "0.3.0-rc.1"
          test "$(jq -r '.version' goassets/template/_task_mecca/framework/release-notes/current.json)" = "0.3.0-rc.1"
          diff -u <(jq -S . release-notes/0.3.0-rc.1.json) <(jq -S . goassets/template/_task_mecca/framework/release-notes/current.json)
      - name: Go runtime and static quality gates
        run: |
          go test ./...
          go vet ./...
          node --check goassets/template/_task_mecca/framework/web/app.js
          node --check goassets/template/_task_mecca/framework/web/select-ui.js
          node --check goassets/template/_task_mecca/framework/web/sw.js
          node --test tests/web_release_notes_030.test.cjs tests/web_select_ui.test.cjs tests/web_storage_management.test.cjs tests/web_notification_delivery.test.cjs tests/web_update_flow.test.cjs
      - name: Build four standalone release candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          flags="-s -w"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$flags" -o dist/task-mecca-windows-amd64.exe ./cmd/task-mecca
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$flags" -o dist/task-mecca-macos-amd64 ./cmd/task-mecca
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$flags" -o dist/task-mecca-macos-arm64 ./cmd/task-mecca
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$flags" -o dist/task-mecca-linux-amd64 ./cmd/task-mecca
          cp goassets/template/_task_mecca/VERSION dist/VERSION.txt
          (cd dist && sha256sum task-mecca-* > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: task-mecca-0.3.0-rc.1
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish immutable prerelease
    needs: verify-and-build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: task-mecca-0.3.0-rc.1
          path: dist
      - name: Publish isolated RC tag and assets
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.3.0-rc.1"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::RC tag $tag already exists. Release candidates must never overwrite an immutable tag."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          {
            echo '# Task Mecca 0.3.0-rc.1 — 관제·운영 경험 개편'
            echo
            jq -r '.summary.ko' release-notes/0.3.0-rc.1.json
            echo
            echo '## 주요 변경 사항'
            jq -r '.highlights[] | "- " + .ko' release-notes/0.3.0-rc.1.json
            echo
            echo '## 테스트 주의'
            echo '정식 Stable이 아닌 시험용 후보입니다. 기존 사용자 프로젝트에는 먼저 별도 백업 및 복제본을 사용하세요.'
            echo '실제 Codex/Claude Hook 및 Telegram 연결 확인은 별도로 필요합니다.'
          } > release-description.md
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Task Mecca 0.3.0-rc.1 — 관제·운영 경험 개편" --notes-file release-description.md \
            dist/task-mecca-windows-amd64.exe dist/task-mecca-macos-amd64 dist/task-mecca-macos-arm64 dist/task-mecca-linux-amd64 dist/SHA256SUMS.txt
          # The version marker is published only after all binaries and checksums are available.
          gh release upload "$tag" dist/VERSION.txt
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  installation-smoke:
    name: RC installation and data preservation · ${{ matrix.os }}
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install and migrate Stable to RC (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/task-mecca-rc-home"
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          TASK_MECCA_RELEASE_TAG=release-stable sh ./install.sh
          task-mecca --version | head -1 | grep -Fx "task-mecca 0.2.52"
          mkdir -p "$RUNNER_TEMP/rc-project"
          cd "$RUNNER_TEMP/rc-project"
          task-mecca init
          mkdir -p _task_mecca/data/backlog
          printf 'preserve-owned-data\n' > _task_mecca/data/backlog/keep.txt
          printf '\ncustom-project-doc\n' >> _task_mecca/framework/README.md
          TASK_MECCA_RELEASE_TAG=v0.3.0-rc.1 sh "$GITHUB_WORKSPACE/install.sh"
          task-mecca --version | head -1 | grep -Fx "task-mecca 0.3.0-rc.1"
          task-mecca migrate --choice backup --json > "$RUNNER_TEMP/migrate-result.json"
          grep -Fx "preserve-owned-data" _task_mecca/data/backlog/keep.txt
          test -f _task_mecca/manifest.json
          test -z "$(find _task_mecca/framework -name '*.py' -print -quit)"
      - name: Install and migrate Stable to RC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:TASK_MECCA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "task-mecca-rc-bin"
          $env:TASK_MECCA_RELEASE_TAG = "release-stable"
          & "$env:GITHUB_WORKSPACE/install.ps1"
          $binary = Join-Path $env:TASK_MECCA_INSTALL_DIR "task-mecca.exe"
          if ((& $binary --version)[0] -ne "task-mecca 0.2.52") { throw "Stable baseline mismatch" }
          $project = Join-Path $env:RUNNER_TEMP "rc-project"
          New-Item -ItemType Directory -Path $project -Force | Out-Null
          Push-Location $project
          try {
            & $binary init
            $backlog = Join-Path $project "_task_mecca/data/backlog"
            New-Item -ItemType Directory -Path $backlog -Force | Out-Null
            Set-Content -LiteralPath (Join-Path $backlog "keep.txt") -Value "preserve-owned-data"
            Add-Content -LiteralPath (Join-Path $project "_task_mecca/framework/README.md") -Value "custom-project-doc"
            $env:TASK_MECCA_RELEASE_TAG = "v0.3.0-rc.1"
            & "$env:GITHUB_WORKSPACE/install.ps1"
            if ((& $binary --version)[0] -ne "task-mecca 0.3.0-rc.1") { throw "RC version mismatch" }
            & $binary migrate --choice backup --json
            if ((Get-Content -LiteralPath (Join-Path $backlog "keep.txt")).Trim() -ne "preserve-owned-data") { throw "Project-owned data lost" }
          } finally {
            Pop-Location
          }
